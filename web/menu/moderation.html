<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Модерация фото</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/tray.js" defer></script>
</head>
<body>
  <main id="moderation">
    <a id="moderation-back" href="/">← К меню</a>
    <header><h1>Модерация фото</h1></header>
    <p id="moderation-status" role="status">Проверяем доступ…</p>
    <div id="moderation-content" hidden>
      <section aria-labelledby="queue-title">
        <div class="moderation-toolbar">
          <h2 id="queue-title">Очередь заявок</h2>
          <button id="moderation-refresh" type="button">Обновить</button>
        </div>
        <div id="moderation-queue"></div>
      </section>
      <details id="moderation-history" class="tray-disclosure">
        <summary>История публикаций</summary>
        <p class="note">Из исходного фото можно заново вырезать блюдо в течение 30 дней после закрытия заявки.</p>
        <div id="moderation-history-list"></div>
      </details>
      <section id="moderation-detail" class="tray-detail" aria-label="Заявка"></section>
      <details id="moderation-published" class="tray-disclosure">
        <summary>Опубликованные фото</summary>
        <div id="moderation-photos"></div>
      </details>
    </div>
  </main>
</body>
</html>
